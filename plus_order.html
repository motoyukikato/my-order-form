<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>【お客様用】一括オーダーシステム</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; border-left: 5px solid #3b5998; }
        h1 { margin: 0; font-size: 1.5em; color: #333; }
        
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid #3b5998; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ログイン画面 */
        #login-section { max-width: 500px; margin: 50px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .input-box { width: 100%; padding: 15px; border: 2px solid #ccc; border-radius: 8px; font-size: 1.1em; box-sizing: border-box; margin-bottom: 20px; }
        .input-box:focus { border-color: #3b5998; outline: none; }

        /* テーブル */
        .table-container { background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-x: auto; padding: 15px; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #eef2f7; color: #333; padding: 10px; text-align: left; font-size: 0.9em; border: 1px solid #ccc; position: sticky; top: 0; }
        td { border: 1px solid #ccc; padding: 0; position: relative; }
        
        input.grid-input { width: 100%; height: 100%; box-sizing: border-box; padding: 12px; border: none; outline: none; font-size: 1em; }
        input.grid-input:focus { background-color: #e8f0fe; box-shadow: inset 0 0 0 2px #4285f4; }
        
        .readonly-cell { background-color: #f9f9f9; color: #555; padding: 12px; font-size: 0.9em; min-height: 20px; }
        .row-error { outline: 2px solid #d9534f; outline-offset: -2px; }
        .row-error .readonly-cell { background-color: #fde8e8; color: #d9534f; font-weight: bold; }
        
        .btn { padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1em; transition: 0.2s; color: white; }
        .btn-primary { background: #3b5998; }
        .btn-primary:hover { background: #2d4373; }
        .btn-success { background: #28a745; padding: 15px 40px; font-size: 1.1em; }
        .btn-success:hover { background: #218838; }
        
        .del-btn { color: #d9534f; cursor: pointer; text-align: center; display: block; width: 100%; padding: 12px 0; }
        .del-btn:hover { background: #fde8e8; }
    </style>
</head>
<body>

<div id="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <h3 id="loading-text" style="color:#555;">通信中...</h3>
    <p id="loading-detail" style="color:#888; font-size:0.9em;"></p>
</div>

<!-- 1. ログインセクション -->
<div id="login-section">
    <h2 style="color: #3b5998; margin-top: 0;">一括オーダーシステム</h2>
    <p style="color: #666; font-size: 0.95em; margin-bottom: 25px;">会員ID番号を入力してログインしてください。</p>
    <input type="text" id="login-id" class="input-box" placeholder="QRコード下の記載してあるIDを入力してください" onkeydown="if(event.key==='Enter') verifyCustomer()">
    <button class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 1.1em;" onclick="verifyCustomer()">ログイン</button>
</div>

<!-- 2. オーダーセクション（初期非表示） -->
<div id="order-section" style="display: none;">
    <header>
        <div>
            <h1>一括オーダー入力</h1>
            <div style="color: #666; margin-top: 5px;">ログイン中: <b id="cust-name" style="color: #3b5998;"></b> 様</div>
        </div>
        <div style="display:flex; gap:15px; align-items:center;">
            <span id="total-amount" style="font-size: 1.2em; font-weight: bold; color: #d9534f;">合計: ¥0</span>
            <button class="btn btn-primary" onclick="addNewRow()">＋ 行を追加</button>
            <button class="btn btn-success" id="submit-btn" onclick="submitBatch()">注文を送信する</button>
        </div>
    </header>

    <div class="table-container">
        <table id="grid-table">
            <thead>
                <tr>
                    <th style="width: 50px; text-align:center;">#</th>
                    <th style="width: 150px;">品番/JAN</th>
                    <th style="width: 120px;">メーカー (自動)</th>
                    <th style="width: 250px;">品名 (自動)</th>
                    <th style="width: 90px; text-align:right;">単価</th>
                    <th style="width: 90px;">数量</th>
                    <th style="width: 200px;">備考</th>
                    <th style="width: 50px; text-align:center;">削除</th>
                </tr>
            </thead>
            <tbody id="grid-body">
                <!-- JavaScriptで生成 -->
            </tbody>
        </table>
    </div>
    
    <!-- 品番候補用 -->
    <datalist id="product-list"></datalist>
</div>

<script>
    // ▼ 現在の兼用GAS URLをそのままご利用ください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbw2JetMIiOzKYBnXXaZ-eW5NQnZ_QqQUiRvq5rvXEpoHzR5ta-HKL5ar3tkGtggOR76/exec";
    
    const MAKER_LIST = [
        'カルナック', '星野㈱', 'YARD', 'エルコミューン', 'asca', 'ネイチャーデザインズ',
        '大地農園', 'フロールエバー', 'コアトレーディング', 'ホワイエ', 'ミュールミル',
        'ラライワント', '友膳', '松村工芸・クレイ', 'ポッシュリビング', '東京堂',
        'マグネット', '志成販売', 'コベントガーデン', '坂源', 'インターリンク',
        '三和トレーディング', '村田屋産業'
    ];

    let currentCustomer = null;
    let allProducts = [];
    let rowCount = 0;

    function showLoading(msg, detail = "") {
        document.getElementById('loading-text').innerText = msg;
        document.getElementById('loading-detail').innerText = detail;
        document.getElementById('loading-overlay').style.display = 'flex';
    }
    function hideLoading() {
        document.getElementById('loading-overlay').style.display = 'none';
    }
// --- 1. ログイン処理 ---
async function verifyCustomer() {
    const loginId = document.getElementById('login-id').value.trim();
    if (!loginId) return alert("会員IDを入力してください。");

    /* 
       電話番号でのログインを許可するため、以下の電話番号ブロック処理を削除（コメントアウト）しました。
       
       const numberOnly = loginId.replace(/[^0-9]/g, '');
       if (numberOnly.startsWith('0') && (numberOnly.length === 10 || numberOnly.length === 11)) {
           return alert("電話番号でのログインはできません。会員IDをご入力ください。");
       }
    */

    showLoading("ログイン情報を確認中...");
    try {
        const res = await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ action: "customerSearch", val: loginId })
        });
        const data = await res.json();

        if (data.error) {
            alert("登録が見つかりません。入力内容をご確認ください。");
            hideLoading();
        } else {
            currentCustomer = data;
            document.getElementById('cust-name').innerText = data.customer || data.name;
            document.getElementById('login-section').style.display = 'none';
            
            // 認証成功後、商品マスタを読み込み
            await preloadAllMasters();
            
            document.getElementById('order-section').style.display = 'block';
            for(let i=0; i<10; i++) addNewRow(); // 初期10行
            hideLoading();
            document.querySelector('input[data-col="partNo"]').focus(); // 最初のセルにフォーカス
        }
    } catch (e) {
        alert("通信エラーが発生しました: " + e.message);
        hideLoading();
    }
}
  

    // --- 2. 商品マスタの高速取得 ---
    async function preloadAllMasters() {
        showLoading("商品データを読み込み中...", "※初回のみ数秒かかります");
        try {
            const chunkSize = 5;
            for (let i = 0; i < MAKER_LIST.length; i += chunkSize) {
                const chunk = MAKER_LIST.slice(i, i + chunkSize);
                document.getElementById('loading-detail').innerText = `データ取得中... (${i + chunk.length}/${MAKER_LIST.length}社)`;
                
                const promises = chunk.map(maker => 
                    fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "getAllProducts", targetMaker: maker }) }).then(r=>r.json())
                );
                const results = await Promise.all(promises);
                results.forEach(res => { if(Array.isArray(res)) allProducts.push(...res); });
            }
        } catch (e) {
            alert("マスタデータの読み込みに失敗しました。\n" + e.message);
        }
    }

    function normalizeText(str) {
        if (!str) return "";
        return String(str).normalize("NFKC").replace(/[\u3041-\u3096]/g, match => String.fromCharCode(match.charCodeAt(0) + 0x60)).toUpperCase().trim();
    }

    // --- 3. UI・グリッド制御 ---
    function addNewRow() {
        rowCount++;
        const tr = document.createElement('tr');
        tr.id = 'row-' + rowCount;
        tr.dataset.rowIndex = rowCount;
        
        tr.innerHTML = `
            <td style="text-align:center; color:#888;">${rowCount}</td>
            <td><input type="text" class="grid-input" data-col="partNo" list="product-list" data-row="${rowCount}" oninput="autoComplete(this)" onkeydown="gridKeydown(event)"></td>
            <td><div class="readonly-cell" id="disp-maker-${rowCount}"></div></td>
            <td><div class="readonly-cell" id="disp-name-${rowCount}"></div></td>
            <td><div class="readonly-cell" id="disp-price-${rowCount}" style="text-align:right;"></div></td>
            <td><input type="number" class="grid-input" data-col="quantity" data-row="${rowCount}" min="1" oninput="calculateTotal()" onkeydown="gridKeydown(event)"></td>
            <td><input type="text" class="grid-input" data-col="note" data-row="${rowCount}" onkeydown="gridKeydown(event)"></td>
            <td><span class="del-btn" onclick="deleteRow('${tr.id}')">✖</span></td>
        `;
        document.getElementById('grid-body').appendChild(tr);
    }

    function deleteRow(rowId) {
        document.getElementById(rowId).remove();
        calculateTotal();
    }

    // Excel風のキーボード移動（Enter / Tab / 矢印キー）
    function gridKeydown(e) {
        const input = e.target;
        const r = parseInt(input.dataset.row);
        const c = input.dataset.col;
        const cols = ['partNo', 'quantity', 'note'];
        const cIdx = cols.indexOf(c);

        if (e.key === 'Enter') {
            e.preventDefault();
            let nextRowIdx = r + 1;
            let nextInput = document.querySelector(`input[data-row="${nextRowIdx}"][data-col="${c}"]`);
            
            // 下の行がなければ自動で新規作成
            if (!nextInput) {
                addNewRow();
                nextInput = document.querySelector(`input[data-row="${rowCount}"][data-col="${c}"]`);
            }
            if (nextInput) nextInput.focus();
        } 
        else if (e.key === 'ArrowDown') {
            const nextInput = document.querySelector(`input[data-row="${r+1}"][data-col="${c}"]`);
            if (nextInput) nextInput.focus();
        }
        else if (e.key === 'ArrowUp') {
            const prevInput = document.querySelector(`input[data-row="${r-1}"][data-col="${c}"]`);
            if (prevInput) prevInput.focus();
        }
    }

    // --- 4. 自動補完機能 ---
    function autoComplete(inputElem) {
        const tr = inputElem.closest('tr');
        const r = tr.dataset.rowIndex;
        const val = normalizeText(inputElem.value);
        
        tr.classList.remove('row-error');
        tr.dataset.productObj = "";
        const dispMaker = document.getElementById(`disp-maker-${r}`);
        const dispName = document.getElementById(`disp-name-${r}`);
        const dispPrice = document.getElementById(`disp-price-${r}`);
        const dataList = document.getElementById('product-list');
        
        if (!val) { 
            dispMaker.innerText = ""; dispName.innerText = ""; dispPrice.innerText = ""; 
            dataList.innerHTML = "";
            calculateTotal(); return; 
        }

        // サジェスト（2文字以上）
        if (val.length >= 2) {
            dataList.innerHTML = "";
            let matchCount = 0;
            for (let i = 0; i < allProducts.length; i++) {
                const p = allProducts[i];
                const pn = normalizeText(p.partNo);
                const jan = normalizeText(p.jan || "");
                if (pn.startsWith(val) || jan.startsWith(val)) {
                    const option = document.createElement('option');
                    option.value = p.partNo;
                    option.textContent = `${p.maker || ''} | ${p.name || ''}`;
                    dataList.appendChild(option);
                    if (++matchCount >= 20) break;
                }
            }
        } else {
            dataList.innerHTML = "";
        }
        
        // 完全一致判定
        const found = allProducts.find(p => {
            const pn = normalizeText(p.partNo);
            const jan = normalizeText(p.jan || "");
            return pn === val || jan === val;
        });

        if (found) {
            dispMaker.innerText = found.maker;
            dispName.innerText = found.name;
            dispPrice.innerText = (found.price || 0).toLocaleString();
            tr.dataset.productObj = JSON.stringify(found);
            
            // ロット自動入力
            const qtyInput = tr.querySelector(`input[data-col="quantity"]`);
            if (!qtyInput.value) {
                let cleanLot = found.lot ? String(found.lot).normalize("NFKC").replace(/[^0-9]/g, '') : "1";
                qtyInput.value = cleanLot || "1";
            }
        } else {
            dispMaker.innerText = "";
            dispName.innerText = val.length >= 2 ? "該当なし" : "";
            dispPrice.innerText = "";
        }
        calculateTotal();
    }

    function calculateTotal() {
        let total = 0;
        document.querySelectorAll('#grid-body tr').forEach(tr => {
            const pStr = tr.dataset.productObj;
            const qStr = tr.querySelector(`input[data-col="quantity"]`).value;
            if (pStr && qStr) {
                const p = JSON.parse(pStr);
                const q = parseInt(qStr) || 0;
                total += (p.price || 0) * q;
            }
        });
        document.getElementById('total-amount').innerText = `合計: ¥${total.toLocaleString()}`;
    }

    // --- 5. 一括送信 ---
    async function submitBatch() {
        const btn = document.getElementById('submit-btn');
        const itemsToSubmit = [];
        let hasError = false;

        document.querySelectorAll('#grid-body tr').forEach(tr => {
            const partInput = tr.querySelector(`input[data-col="partNo"]`).value.trim();
            if (!partInput) return; // 空行はスキップ

            const pStr = tr.dataset.productObj;
            const qty = parseInt(tr.querySelector(`input[data-col="quantity"]`).value) || 0;
            const note = tr.querySelector(`input[data-col="note"]`).value.trim();

            if (!pStr || qty <= 0) {
                tr.classList.add('row-error');
                hasError = true;
            } else {
                tr.classList.remove('row-error');
                itemsToSubmit.push({
                    customer: currentCustomer, // ログイン済みの顧客情報を全行に紐付ける
                    product: JSON.parse(pStr),
                    quantity: qty,
                    note: note
                });
            }
        });

        if (hasError) return alert("赤枠の行にエラーがあります（品番間違い、または数量0）。\n修正してください。");
        if (itemsToSubmit.length === 0) return alert("送信するデータがありません。");
        
        if (!confirm(`${itemsToSubmit.length} 件の注文を一括送信します。よろしいですか？`)) return;

        btn.disabled = true;
        btn.innerText = "送信中...";
        showLoading("注文を送信中...");

        try {
            const res = await fetch(GAS_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "batchOrderSubmitMixed",
                    data: { items: itemsToSubmit }
                })
            });
            const result = await res.json();
            
            if (result.success) {
                alert(`ご注文ありがとうございました！\n計 ${result.count} 件の注文が完了しました。`);
                // 送信後は表をリセット
                document.getElementById('grid-body').innerHTML = "";
                rowCount = 0;
                for(let i=0; i<10; i++) addNewRow();
                calculateTotal();
            } else {
                alert("送信エラー: " + result.error);
            }
        } catch (e) {
            alert("通信エラーが発生しました: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "注文を送信する";
            hideLoading();
        }
    }
</script>
</body>
</html>
