<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商品スキャン＆価格チェック</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        /* モダンでクリーンなUI設計 */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 15px 10px; background-color: #f0f2f5; color: #333; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); box-sizing: border-box;}
        h1 { font-size: 1.2em; text-align: center; margin: 0 0 15px 0; color: #2c3e50; }
        
        .system-status { text-align: center; font-size: 0.8em; margin-bottom: 20px; padding: 6px; border-radius: 6px; background-color: #f1f5f9; color: #64748b; font-weight: bold; transition: all 0.3s ease; }
        .status-syncing { background-color: #e0f2fe; color: #0369a1; }
        .status-ready { background-color: #dcfce7; color: #15803d; }
        .status-error { background-color: #fee2e2; color: #b91c1c; }

        .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        select { padding: 14px; font-size: 1em; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc; color: #334155; outline: none; }
        
        .btn { padding: 14px; font-size: 1.1em; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-secondary { background-color: #10b981; color: white; width: 100%; margin-top: 15px;}

        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 20px; background-color: #1e293b; min-height: 220px; display: flex; align-items: center; justify-content: center; color: #94a3b8; border: 2px dashed #cbd5e1; }
        
        /* 結果表示エリアの調整 */
        .result-box { display: none; padding: 20px; background: #f0fdf4; border-radius: 12px; border: 1px solid #bbf7d0; animation: fadeIn 0.2s ease; text-align: center;}
        
        .product-hinban { font-size: 0.9em; color: #64748b; margin-bottom: 4px; font-weight: bold; }
        .product-name { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #0f172a; word-break: break-all; }
        
        .price-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #cbd5e1;}
        .price-row:last-child { border-bottom: none; }
        .price-label { color: #64748b; font-size: 0.95em; }
        .price-normal { font-size: 1.2em; color: #334155; font-weight: bold; text-decoration: line-through; /* 通常下代は取り消し線を入れると割引感がでます */ }
        .price-premium { font-size: 1.4em; color: #e11d48; font-weight: 900; }

        .result-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; margin-bottom: 15px; }
        .badge-success { background-color: #bbf7d0; color: #166534; }
        .badge-error { background-color: #fecdd3; color: #9f1239; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>商品スキャン</h1>
        
        <div id="system-status" class="system-status">データを準備中...</div>
        
        <div class="controls" id="controls">
            <select id="camera-select"><option value="">カメラを準備中...</option></select>
            <button class="btn btn-primary" id="start-btn" onclick="startScannerAction()">スキャン開始</button>
            <button class="btn btn-danger" id="stop-btn" onclick="stopScanner()" style="display:none;">スキャン停止</button>
        </div>

        <div id="reader">カメラを許可して開始してください</div>

        <!-- 読み取り結果エリア -->
        <div id="result-box" class="result-box">
            <div id="result-badge" class="result-badge"></div>
            
            <!-- 品番表示を追加 -->
            <div class="product-hinban" id="res-hinban">品番: ---</div>
            <div class="product-name" id="res-name">品名</div>
            
            <div class="price-row">
                <span class="price-label">通常下代</span>
                <span class="price-normal" id="res-price-normal">¥0</span>
            </div>
            <div class="price-row">
                <span class="price-label">プレミアム会員 (5%OFF)</span>
                <span class="price-premium" id="res-price-premium">¥0</span>
            </div>

            <button class="btn btn-secondary" id="next-btn" onclick="resetAndStartScanner()">次の商品をスキャン</button>
        </div>
    </div>

    <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZCsMear3DtUYc19OAc7iKPVZqsLOfPtqAZSrF00J_ORtZ-rPuVH4kfpirc30tSWLb/exec";
    const SCANNER_CONFIG = { fps: 10, qrbox: { width: 260, height: 130 } };

    let html5QrCode = null;
    let localProductData = {}; 
    let isProcessing = false;

    const elements = {
        sysStatus: document.getElementById('system-status'),
        cameraSelect: document.getElementById('camera-select'),
        startBtn: document.getElementById('start-btn'),
        stopBtn: document.getElementById('stop-btn'),
        reader: document.getElementById('reader'),
        resultBox: document.getElementById('result-box'),
        resBadge: document.getElementById('result-badge'),
        resHinban: document.getElementById('res-hinban'),
        resName: document.getElementById('res-name'),
        resPriceNormal: document.getElementById('res-price-normal'),
        resPricePremium: document.getElementById('res-price-premium')
    };

    window.onload = () => {
        html5QrCode = new Html5Qrcode("reader");
        
        const cachedData = localStorage.getItem('autoCachedProductData');
        if (cachedData) {
            localProductData = JSON.parse(cachedData);
            updateSystemStatus(`準備完了（${Object.keys(localProductData).length}件）`, 'status-ready');
        }

        fetchLatestDataInBackground();

        Html5Qrcode.getCameras().then(populateCameraDropdown).catch(e => {
            elements.cameraSelect.innerHTML = '<option value="">カメラがブロックされています</option>';
        });
    };

    async function fetchLatestDataInBackground() {
        if (Object.keys(localProductData).length === 0) {
            updateSystemStatus("初回データをダウンロード中...", "status-syncing");
        } else {
            updateSystemStatus("裏側で最新価格に同期中...", "status-syncing");
        }

        try {
            const url = `${GAS_WEB_APP_URL}?t=${new Date().getTime()}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error("Network response was not ok");
            const data = await response.json();
            
            localProductData = data;
            localStorage.setItem('autoCachedProductData', JSON.stringify(localProductData));
            updateSystemStatus(`最新データに自動更新済み（${Object.keys(localProductData).length}件）`, 'status-ready');
        } catch (error) {
            if (Object.keys(localProductData).length > 0) {
                updateSystemStatus("オフライン（保存済みデータで動作中）", "status-error");
            } else {
                updateSystemStatus("データ取得失敗。電波の良い所で開き直してください", "status-error");
            }
        }
    }

    function updateSystemStatus(text, className) {
        elements.sysStatus.textContent = text;
        elements.sysStatus.className = `system-status ${className}`;
    }

    function populateCameraDropdown(devices) {
        if (!devices || devices.length === 0) {
            elements.cameraSelect.innerHTML = '<option value="">カメラが見つかりません</option>';
            return;
        }
        
        elements.cameraSelect.innerHTML = '';
        const savedCameraId = localStorage.getItem('preferredCameraId');
        let selectedIndex = 0;
        let backIndex = -1;

        devices.forEach((device, i) => {
            const opt = document.createElement('option');
            opt.value = device.id;
            opt.text = device.label || `カメラ ${i + 1}`;
            elements.cameraSelect.appendChild(opt);
            if (savedCameraId === device.id) selectedIndex = i;
            if (opt.text.toLowerCase().match(/back|rear|背面|アウト/)) backIndex = i;
        });

        if (!savedCameraId && backIndex !== -1) selectedIndex = backIndex;
        elements.cameraSelect.selectedIndex = selectedIndex;
    }

    elements.cameraSelect.addEventListener('change', () => {
        localStorage.setItem('preferredCameraId', elements.cameraSelect.value);
        if (html5QrCode?.isScanning) stopScanner().then(startScannerWithSelectedId);
    });

    async function startScannerAction() {
        if (Object.keys(localProductData).length === 0) {
            alert("商品データをダウンロード中です。数秒待ってからもう一度押してください。");
            return;
        }
        if (!elements.cameraSelect.value) {
            alert("カメラを許可してください。");
            return;
        }
        startScannerWithSelectedId();
    }

    function startScannerWithSelectedId() {
        const cameraId = elements.cameraSelect.value;
        if (!cameraId) return;
        
        localStorage.setItem('preferredCameraId', cameraId);
        elements.reader.innerHTML = ""; 
        elements.resultBox.style.display = 'none';
        isProcessing = false; 

        html5QrCode.start(cameraId, SCANNER_CONFIG, onScanSuccess)
            .then(() => {
                elements.startBtn.style.display = 'none';
                elements.stopBtn.style.display = 'block';
                elements.cameraSelect.style.display = 'none'; 
            }).catch(e => {
                alert("カメラの起動に失敗しました。");
            });
    }

    async function stopScanner() {
        if (html5QrCode?.isScanning) {
            await html5QrCode.stop();
            elements.startBtn.style.display = 'block';
            elements.stopBtn.style.display = 'none';
            elements.cameraSelect.style.display = 'block';
        }
    }

    function resetAndStartScanner() {
        elements.resultBox.style.display = 'none';
        startScannerWithSelectedId();
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;
        stopScanner(); 

        const productInfo = localProductData[decodedText];

        if (productInfo) {
            // 品番・品名・価格の表示
            const normalPrice = parseInt(productInfo.price, 10);
            const premiumPrice = Math.floor(normalPrice * 0.95);
            
            elements.resBadge.className = "result-badge badge-success";
            elements.resBadge.textContent = "検索成功！";
            
            elements.resHinban.textContent = `品番: ${productInfo.hinban}`;
            elements.resName.textContent = productInfo.name;
            elements.resPriceNormal.textContent = `¥${normalPrice.toLocaleString()}`;
            elements.resPricePremium.textContent = `¥${premiumPrice.toLocaleString()}`;
        } else {
            elements.resBadge.className = "result-badge badge-error";
            elements.resBadge.textContent = "未登録の商品です";
            
            elements.resHinban.textContent = `JAN: ${decodedText}`;
            elements.resName.textContent = "---";
            elements.resPriceNormal.textContent = "¥---";
            elements.resPricePremium.textContent = "¥---";
        }

        elements.resultBox.style.display = 'block';
    }
    </script>
</body>
</html>
