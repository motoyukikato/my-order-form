<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商品スキャン＆価格チェック</title>
    <!-- バーコード読み取り用のライブラリを読み込み -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background-color: #f7f9fc; color: #333; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box;}
        h1 { font-size: 1.1em; text-align: center; margin-top: 0; }
        .controls { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        
        /* セレクトボックスを分かりやすく表示 */
        select { padding: 12px; font-size: 1em; border-radius: 8px; border: 1px solid #ccc; background-color: #fff; }
        button { padding: 12px; font-size: 1.1em; border-radius: 8px; border: 1px solid #ccc; background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:active { background-color: #2980b9; }
        
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; background-color: #eee; min-height: 200px; display: flex; align-items: center; justify-content: center; color: #999; }
        
        .result-box { display: none; padding: 15px; background: #e8f6f3; border-radius: 8px; border: 1px solid #16a085; }
        .product-name { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; word-break: break-all; }
        .price-normal { font-size: 1em; color: #555; }
        .price-premium { font-size: 1.3em; color: #e74c3c; font-weight: bold; margin-top: 5px; }
        .loading { text-align: center; color: #7f8c8d; font-size: 0.9em; display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>商品スキャン</h1>
        
        <div class="controls">
            <!-- カメラ選択ドロップダウン（常に表示） -->
            <select id="camera-select">
                <option value="">カメラを準備中...</option>
            </select>
            <button id="start-btn" onclick="startScannerAction()">スキャン開始</button>
            <button id="stop-btn" onclick="stopScanner()" style="display:none; background-color:#95a5a6;">スキャン停止</button>
        </div>

        <!-- カメラ映像が表示されるエリア -->
        <div id="reader">カメラ映像がここに表示されます</div>

        <div id="loading" class="loading">データベースに照会中...</div>

        <!-- 読み取り結果表示エリア -->
        <div id="result-box" class="result-box">
            <div class="product-name" id="res-name">商品名</div>
            <div class="price-normal">通常価格: <span id="res-price-normal">¥0</span></div>
            <div class="price-premium">プレミアム会員 (5%OFF): <span id="res-price-premium">¥0</span></div>
        </div>
    </div>

    <script>
        // ★★★ここにGASのウェブアプリURLを貼り付けてください★★★
        const GAS_WEB_APP_URL = "あなたの_ウェブアプリ_URLを_ここに_貼り付ける";

        let html5QrCode = null;
        const cameraSelect = document.getElementById('camera-select');
        const scannerConfig = { fps: 10, qrbox: { width: 250, height: 150 } };

        // ページ読み込み時の処理
        window.onload = () => {
            html5QrCode = new Html5Qrcode("reader");
            
            // 初回読み込み時にカメラリストの取得を試みる（許可済みなら即座にリスト化）
            Html5Qrcode.getCameras().then(devices => {
                populateCameraDropdown(devices);
            }).catch(err => {
                cameraSelect.innerHTML = '<option value="">「スキャン開始」を押してカメラを許可してください</option>';
            });
        };

        // ドロップダウンリストを構築する関数
        function populateCameraDropdown(devices) {
            if (!devices || devices.length === 0) {
                cameraSelect.innerHTML = '<option value="">カメラが見つかりません</option>';
                return;
            }
            
            cameraSelect.innerHTML = '';
            
            // 以前に選択して保存したカメラのIDを取得
            const savedCameraId = localStorage.getItem('preferredCameraId');
            let selectedIndex = 0;
            let foundSaved = false;
            let backCameraIndex = -1;

            devices.forEach((device, index) => {
                const option = document.createElement('option');
                option.value = device.id;
                option.text = device.label || `カメラ ${index + 1}`;
                cameraSelect.appendChild(option);

                // 保存されたカメラIDと一致するか確認
                if (savedCameraId && device.id === savedCameraId) {
                    selectedIndex = index;
                    foundSaved = true;
                }

                // 保存データがない場合、名前から「背面カメラ」を探す
                const label = option.text.toLowerCase();
                if (label.includes("back") || label.includes("rear") || label.includes("背面") || label.includes("アウト")) {
                    if (backCameraIndex === -1) backCameraIndex = index;
                }
            });

            // 以前の保存履歴がなく、背面カメラが見つかった場合はそれを初期選択
            if (!foundSaved && backCameraIndex !== -1) {
                selectedIndex = backCameraIndex;
            }

            cameraSelect.selectedIndex = selectedIndex;
        }

        // ドロップダウンが変更された時の処理
        cameraSelect.addEventListener('change', () => {
            const newCameraId = cameraSelect.value;
            if (newCameraId) {
                // 選んだカメラをブラウザに保存（次回用）
                localStorage.setItem('preferredCameraId', newCameraId);
                
                // スキャン中の場合は一度停止して、新しいカメラで再起動
                if (html5QrCode && html5QrCode.isScanning) {
                    stopScanner().then(() => startScannerWithSelectedId());
                }
            }
        });

        // 「スキャン開始」ボタンを押したときの処理
        async function startScannerAction() {
            // カメラリストがまだ取得できていない（初回許可時など）場合
            if (cameraSelect.options[0].value === "") {
                try {
                    const devices = await Html5Qrcode.getCameras();
                    populateCameraDropdown(devices);
                } catch (err) {
                    alert("カメラのアクセス許可が必要です。ブラウザの設定等で許可してください。");
                    return;
                }
            }
            startScannerWithSelectedId();
        }

        // 選択されているカメラでスキャンを開始する
        function startScannerWithSelectedId() {
            const cameraId = cameraSelect.value;
            if (!cameraId) {
                alert("有効なカメラが選択されていません。");
                return;
            }

            // 念のため、起動しようとしているカメラIDを保存
            localStorage.setItem('preferredCameraId', cameraId);

            document.getElementById('reader').innerHTML = ""; // プレースホルダーの文字を消す

            html5QrCode.start(cameraId, scannerConfig, onScanSuccess)
                .then(() => {
                    document.getElementById('start-btn').style.display = 'none';
                    document.getElementById('stop-btn').style.display = 'block';
                    document.getElementById('result-box').style.display = 'none';
                })
                .catch(err => {
                    console.error("起動エラー", err);
                    alert("カメラが起動できませんでした。真っ黒になる場合は、ドロップダウンから【別のカメラ】を選び直してください。");
                });
        }

        async function stopScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                await html5QrCode.stop();
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('stop-btn').style.display = 'none';
            }
        }

        // バーコードが読み取れた時の処理
        function onScanSuccess(decodedText) {
            stopScanner(); // 連続読み取り防止
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result-box').style.display = 'none';

            const url = `${GAS_WEB_APP_URL}?jan=${decodedText}&t=${new Date().getTime()}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    if (data.found) {
                        const normalPrice = parseInt(data.price, 10);
                        const premiumPrice = Math.floor(normalPrice * 0.95);

                        document.getElementById('res-name').textContent = data.name + " (" + decodedText + ")";
                        document.getElementById('res-price-normal').textContent = '¥' + normalPrice.toLocaleString();
                        document.getElementById('res-price-premium').textContent = '¥' + premiumPrice.toLocaleString();
                        document.getElementById('result-box').style.display = 'block';
                    } else {
                        alert(`JANコード [${decodedText}] は未登録です。`);
                    }
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    alert("データの取得に失敗しました。");
                });
        }
    </script>
</body>
</html>
