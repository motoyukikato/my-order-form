<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商品スキャン＆価格チェック(爆速版)</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; background-color: #f7f9fc; color: #333; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box;}
        h1 { font-size: 1.1em; text-align: center; margin-top: 0; }
        .data-sync-area { background: #eef2f5; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; border: 1px solid #dcdde1; }
        .sync-status { font-size: 0.85em; color: #555; margin-bottom: 8px; }
        .btn-sync { background-color: #2c3e50; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 0.9em; }
        .controls { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        select { padding: 12px; font-size: 1em; border-radius: 8px; border: 1px solid #ccc; background-color: #fff; }
        .btn-scan { padding: 12px; font-size: 1.1em; border-radius: 8px; border: 1px solid #ccc; background-color: #3498db; color: white; cursor: pointer; font-weight: bold; }
        #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 20px; background-color: #eee; min-height: 200px; display: flex; align-items: center; justify-content: center; color: #999; }
        .result-box { display: none; padding: 15px; background: #e8f6f3; border-radius: 8px; border: 1px solid #16a085; }
        .product-name { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; word-break: break-all; }
        .price-normal { font-size: 1em; color: #555; }
        .price-premium { font-size: 1.3em; color: #e74c3c; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>商品スキャン(爆速版)</h1>
        
        <div class="data-sync-area">
            <div class="sync-status" id="sync-status">商品データ: 確認中...</div>
            <button class="btn-sync" onclick="fetchProductData()" id="sync-btn">最新データに更新</button>
        </div>
        
        <div class="controls">
            <select id="camera-select"><option value="">カメラを準備中...</option></select>
            <button class="btn-scan" id="start-btn" onclick="startScannerAction()">スキャン開始</button>
            <button class="btn-scan" id="stop-btn" onclick="stopScanner()" style="display:none; background-color:#95a5a6;">スキャン停止</button>
        </div>

        <div id="reader">カメラ映像がここに表示されます</div>

        <div id="result-box" class="result-box">
            <div class="product-name" id="res-name">商品名</div>
            <div class="price-normal">通常価格: <span id="res-price-normal">¥0</span></div>
            <div class="price-premium">プレミアム会員 (5%OFF): <span id="res-price-premium">¥0</span></div>
        </div>
    </div>

    <script>
        // ★★★ここにGASのURLを貼り付けてください（前後の " " を消さないように注意！）★★★
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZCsMear3DtUYc19OAc7iKPVZqsLOfPtqAZSrF00J_ORtZ-rPuVH4kfpirc30tSWLb/exec";

        let localProductData = {}; 
        let html5QrCode = null;
        const cameraSelect = document.getElementById('camera-select');
        const scannerConfig = { fps: 10, qrbox: { width: 250, height: 150 } };

        window.onload = () => {
            html5QrCode = new Html5Qrcode("reader");
            const savedData = localStorage.getItem('localProductData');
            if (savedData) {
                localProductData = JSON.parse(savedData);
                document.getElementById('sync-status').textContent = `商品データ: 保存済み (${Object.keys(localProductData).length}件)`;
            } else {
                document.getElementById('sync-status').textContent = `商品データがありません。更新を押してください`;
                document.getElementById('sync-status').style.color = 'red';
            }
            Html5Qrcode.getCameras().then(populateCameraDropdown).catch(e => {
                cameraSelect.innerHTML = '<option value="">カメラを許可してください</option>';
            });
        };

        function fetchProductData() {
            const btn = document.getElementById('sync-btn');
            const status = document.getElementById('sync-status');
            
            btn.disabled = true;
            btn.textContent = "ダウンロード中...";
            status.textContent = "取得中...";

            fetch(`${GAS_WEB_APP_URL}?t=${new Date().getTime()}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTPエラー: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    localProductData = data;
                    localStorage.setItem('localProductData', JSON.stringify(localProductData));
                    const itemCount = Object.keys(localProductData).length;
                    status.textContent = `商品データ: 最新 (${itemCount}件)`;
                    alert(`${itemCount}件のデータをスマホに保存しました！`);
                })
                .catch(error => {
                    status.textContent = "通信失敗";
                    status.style.color = 'red';
                    // エラーの本当の理由をポップアップで表示します
                    alert("【エラー詳細】\n" + error.message + "\n\n・URLのコピペミス\n・スマホがオフライン\nのいずれかの可能性があります。");
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.textContent = "最新データに更新";
                });
        }

        function populateCameraDropdown(devices) {
            if (!devices || devices.length === 0) return;
            cameraSelect.innerHTML = '';
            const savedCameraId = localStorage.getItem('preferredCameraId');
            let selectedIndex = 0;
            let backIndex = -1;

            devices.forEach((device, i) => {
                const opt = document.createElement('option');
                opt.value = device.id;
                opt.text = device.label || `カメラ ${i + 1}`;
                cameraSelect.appendChild(opt);
                if (savedCameraId === device.id) selectedIndex = i;
                if (opt.text.toLowerCase().match(/back|rear|背面|アウト/)) backIndex = i;
            });

            if (!savedCameraId && backIndex !== -1) selectedIndex = backIndex;
            cameraSelect.selectedIndex = selectedIndex;
        }

        cameraSelect.addEventListener('change', () => {
            localStorage.setItem('preferredCameraId', cameraSelect.value);
            if (html5QrCode?.isScanning) {
                stopScanner().then(startScannerWithSelectedId);
            }
        });

        async function startScannerAction() {
            if (Object.keys(localProductData).length === 0) {
                alert("先に「最新データに更新」ボタンを押してください。");
                return;
            }
            if (!cameraSelect.value) {
                try {
                    const devices = await Html5Qrcode.getCameras();
                    populateCameraDropdown(devices);
                } catch(e) {
                    alert("カメラを許可してください");
                    return;
                }
            }
            startScannerWithSelectedId();
        }

        function startScannerWithSelectedId() {
            if (!cameraSelect.value) return;
            localStorage.setItem('preferredCameraId', cameraSelect.value);
            document.getElementById('reader').innerHTML = ""; 

            html5QrCode.start(cameraSelect.value, scannerConfig, onScanSuccess)
                .then(() => {
                    document.getElementById('start-btn').style.display = 'none';
                    document.getElementById('stop-btn').style.display = 'block';
                    document.getElementById('result-box').style.display = 'none';
                }).catch(e => alert("カメラが起動できませんでした"));
        }

        async function stopScanner() {
            if (html5QrCode?.isScanning) {
                await html5QrCode.stop();
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('stop-btn').style.display = 'none';
            }
        }

        function onScanSuccess(decodedText) {
            stopScanner();
            document.getElementById('result-box').style.display = 'none';
            const product = localProductData[decodedText];

            if (product) {
                const normalPrice = parseInt(product.price, 10);
                const premiumPrice = Math.floor(normalPrice * 0.95);
                document.getElementById('res-name').textContent = `${product.name} (${decodedText})`;
                document.getElementById('res-price-normal').textContent = `¥${normalPrice.toLocaleString()}`;
                document.getElementById('res-price-premium').textContent = `¥${premiumPrice.toLocaleString()}`;
                document.getElementById('result-box').style.display = 'block';
            } else {
                alert(`JANコード [${decodedText}] は未登録です。`);
            }
        }
    </script>
</body>
</html>
