function getClearedList() {
    return JSON.parse(localStorage.getItem("kanji_cleared_list") || "[]");
}

function saveCleared(id) {
    let cleared = getClearedList();
    if (!cleared.includes(id)) {
        cleared.push(id);
        localStorage.setItem("kanji_cleared_list", JSON.stringify(cleared));
    }
}

function removeCleared(id) {
    let cleared = getClearedList();
    cleared = cleared.filter(item => item !== id);
    localStorage.setItem("kanji_cleared_list", JSON.stringify(cleared));
}

function resetProgress() {
    if (confirm("これまでのクリア記録をすべて消去しますか？")) {
        localStorage.removeItem("kanji_cleared_list");
        loadQuestions();
    }
}

function loadQuestions() {
    const round = document.getElementById("roundSelect").value;
    const questions = quizData[round];
    renderQuestions(questions, `第${round}回 全問題`);
}

function startRandomTest() {
    const round = document.getElementById("roundSelect").value;
    const questions = quizData[round];
    const cleared = getClearedList();

    let unclearedQuestions = questions.filter(q => !cleared.includes(q.id));

    let pool = unclearedQuestions;
    let isAllCleared = false;

    if (pool.length === 0) {
        pool = [...questions];
        isAllCleared = true;
    }

    // シャッフルして10問取得
    let shuffled = [...pool].sort(() => Math.random() - 0.5);
    let selected = shuffled.slice(0, 10);

    let titleText = `🎲 第${round}回 ランダム10問テスト`;
    if (isAllCleared) {
        titleText += " (全問クリア済みのため復習出題)";
    }

    renderQuestions(selected, titleText);
}

function renderQuestions(questions, statusText) {
    const container = document.getElementById("quizContainer");
    document.getElementById("statusBox").textContent = statusText;

    if (!questions || questions.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>問題が見つかりません。</p>";
        updateScore(0, 0);
        return;
    }

    const clearedList = getClearedList();
    let html = "";
    let currentType = "";

    questions.forEach((q) => {
        if (q.type === "kanji" && currentType !== "kanji") {
            html += `<div class="section-title">※ 次の――線部のカタカナを漢字に直しましょう。</div>`;
            currentType = "kanji";
        } else if (q.type === "kana" && currentType !== "kana") {
            html += `<div class="section-title">※ 次の漢字をひらがなに直しましょう。</div>`;
            currentType = "kana";
        }

        const isCleared = clearedList.includes(q.id);

        html += `
            <div class="question-card ${isCleared ? 'cleared' : ''}" data-id="${q.id}">
                ${isCleared ? '<div class="badge-cleared">✓ クリア済み</div>' : ''}
                <div class="q-text">${formatQuestionText(q.q, q.type)}</div>
                <div class="ans-area">
                    <button type="button" class="toggle-ans-btn" onclick="toggleAnswer(this)">答えを見る</button>
                    <span class="ans-text">${q.a}</span>
                    <div class="check-group">
                        <button type="button" class="btn-check ${isCleared ? 'selected-ok' : ''}" onclick="markAnswer(this, 'ok')">〇 正解</button>
                        <button type="button" class="btn-check" onclick="markAnswer(this, 'ng')">✕ 不正解</button>
                    </div>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
    
    // 初期スコア計算
    const okCount = clearedList.filter(id => questions.some(q => q.id === id)).length;
    updateScore(okCount, questions.length);
}

function formatQuestionText(text, type) {
    if (type === "kana") return text;
    return text.replace(/([ァ-ヴー]{2,})/g, '<span class="katakana">$1</span>');
}

function toggleAnswer(btn) {
    const parent = btn.closest('.ans-area');
    const ansText = parent.querySelector('.ans-text');
    
    if (ansText.classList.contains('is-visible')) {
        ansText.classList.remove('is-visible');
        btn.textContent = '答えを見る';
    } else {
        ansText.classList.add('is-visible');
        btn.textContent = '答えを隠す';
    }
}

function markAnswer(btn, result) {
    const card = btn.closest('.question-card');
    const qId = card.getAttribute('data-id');
    const buttons = card.querySelectorAll('.btn-check');
    
    buttons.forEach(b => b.classList.remove('selected-ok', 'selected-ng'));

    if (result === 'ok') {
        btn.classList.add('selected-ok');
        card.setAttribute('data-status', 'ok');
        card.classList.add('cleared');
        saveCleared(qId);
    } else {
        btn.classList.add('selected-ng');
        card.setAttribute('data-status', 'ng');
        card.classList.remove('cleared');
        removeCleared(qId);
    }

    // スコア更新
    const total = document.querySelectorAll('.question-card').length;
    const okCards = document.querySelectorAll('.question-card[data-status="ok"], .question-card.cleared:not([data-status="ng"])');
    
    updateScore(okCards.length, total);
}

function updateScore(score, total) {
    document.getElementById('score').textContent = score;
    document.getElementById('total').textContent = total;
}

window.onload = loadQuestions;
</script>

</body>
</html>
